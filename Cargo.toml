[package]
name = "wmde-idle"
version = "1.11.0"
edition = "2024"

[dependencies]
keyframe = "1.1.1"
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"] }
cosmic-config = { git = "https://github.com/pop-os/libcosmic", features = ["calloop"] }
cosmic-idle-config = { path = "./cosmic-idle-config" }
cosmic-settings-config = { git = "https://github.com/pop-os/cosmic-settings-daemon" }
calloop = { version = "0.14.3", features = ["executor"] }
calloop-wayland-source = "0.4.1"
log = "0.4.28"
env_logger = "0.11.8"
upower_dbus = { git = "https://github.com/pop-os/dbus-settings-bindings" }
zbus = "5.12"
futures-lite = "2.6.1"

[workspace]
members = [
    "cosmic-idle-config"
]

# Build against the WMDE forks. Patched crates keep their upstream names and dirs; one
# [patch] table per source (see CLAUDE.md).
# libcosmic: config root cosmic -> wmde. cosmic-config pulls iced_futures through its
# default subscription feature, so the iced crates it needs come from the fork as well.
[patch."https://github.com/pop-os/libcosmic"]
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
iced_core = { path = "../libcosmic/iced/core" }
iced_futures = { path = "../libcosmic/iced/futures" }

# System actions (LockScreen, Suspend) live under fun.wmde.Settings.Shortcuts.
[patch."https://github.com/pop-os/cosmic-settings-daemon"]
cosmic-settings-config = { path = "../wmde-settings-daemon/config" }

[patch."https://github.com/pop-os/dbus-settings-bindings"]
upower_dbus = { path = "../wmde-dbus-settings-bindings/upower" }

# WMDE: shared release profile, see .doc/perf.
#  - panic = "abort" drops .eh_frame and .gcc_except_table; catch_unwind stops catching,
#    which in this stack only guards SVG parsing in iced's vector backends.
#  - lto = "fat" with one codegen unit removes what monomorphisation duplicated.
# The LTO half is expensive and single threaded; FAST=1 turns it off for development
# builds without touching panic or opt-level, so behaviour still matches what ships.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
